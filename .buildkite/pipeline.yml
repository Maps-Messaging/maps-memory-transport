steps:
  - label: ":maven: Build and Deploy"
    command:
      - |
        set -e
        export JAVA_HOME=/usr/lib/jvm/java-25-openjdk-amd64
        test -x "${JAVA_HOME}/bin/javac"
        export PATH="${JAVA_HOME}/bin:${PATH}"
        java -version
        javac -version
        test "$(javac -version 2>&1 | cut -d ' ' -f 2 | cut -d . -f 1)" = 25
        SONAR_TOKEN=$(buildkite-agent secret get SONAR_TOKEN)
        mvn clean deploy
        mvn sonar:sonar -Dsonar.token="${SONAR_TOKEN}" -Dsonar.branch.name=development
    agents:
      queue: "java_build_queue_aws"
